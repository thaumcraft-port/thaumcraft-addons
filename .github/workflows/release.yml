name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (default: today's date, e.g. 2026.10.14)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository
        run: python scripts/validate.py --check-generated

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release assets
        env:
          RELEASE_TAG: latest
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: python scripts/release_bundle.py --version "${{ steps.ver.outputs.version }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Thaumcraft 4R Addons ${{ steps.ver.outputs.version }}
          body_path: dist/release_notes.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/*.jar
            dist/*.zip
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
