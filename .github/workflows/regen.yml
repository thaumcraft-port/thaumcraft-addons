name: Regenerate index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    name: Rebuild catalog and README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate catalog + README
        run: python scripts/gen_readme.py

      - name: Commit changes if any
        shell: bash
        run: |
          if git diff --quiet -- catalog README.md; then
            echo "nothing to update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog README.md
          git commit -m "chore: regenerate catalog and README"
          git push
