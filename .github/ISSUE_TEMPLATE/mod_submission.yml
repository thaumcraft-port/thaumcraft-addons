name: 提交模组 / Submit a mod
description: 想把自己的 TC4R 附属模组加入本仓库（推荐直接提 PR）
title: "[Mod] "
labels: ["mod-submission"]
body:
  - type: markdown
    attributes:
      value: |
        **推荐做法**：直接 fork 仓库并运行 `python scripts/add_mod.py 你的模组.jar` 后提 PR，详见 [贡献指南](https://github.com/thaumcraft-port/thaumcraft-addons/blob/main/docs/CONTRIBUTING.md)。
        如果你不方便提 PR，也可以用本表单登记，由维护者协助入库。
  - type: input
    id: name
    attributes:
      label: 模组名称
    validations:
      required: true
  - type: input
    id: modid
    attributes:
      label: modId
      description: mods.toml 中的 modId
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 源码仓库地址
      placeholder: https://github.com/...
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: 开源许可
      description: 必须允许再分发
      placeholder: "MIT / LGPL-3.0 / CC0-1.0 ..."
    validations:
      required: true
  - type: dropdown
    id: mc
    attributes:
      label: Minecraft 版本
      options:
        - "1.20.1"
        - "1.21.1"
        - 其他
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: 加载器
      options:
        - Forge
        - NeoForge
    validations:
      required: true
  - type: input
    id: tc4
    attributes:
      label: 依赖的 TC4R 版本范围
      description: 来自 mods.toml 中 thaumcraft 依赖项
      placeholder: "例如 [4.2.3.5-1.20.1-port.0.1.0-20738,)"
    validations:
      required: true
  - type: input
    id: download
    attributes:
      label: 模组下载地址
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: about
    attributes:
      label: 模组简介
      description: 一两句话介绍功能
    validations:
      required: false
