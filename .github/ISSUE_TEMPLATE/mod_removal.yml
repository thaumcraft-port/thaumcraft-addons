name: 移除模组 / Remove a mod
description: 作者本人申请移除本仓库中的模组文件
title: "[Remove] "
labels: ["removal"]
body:
  - type: markdown
    attributes:
      value: |
        如果你是模组作者并希望停止在本仓库分发，请填写本表单；我们会尽快移除相关文件。
  - type: input
    id: mod
    attributes:
      label: 模组名称 / 文件名
    validations:
      required: true
  - type: input
    id: proof
    attributes:
      label: 作者身份证明
      description: 指向你的源码仓库 / 作者主页，或说明如何在 Issue 中验证身份
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 说明（可选）
    validations:
      required: false
